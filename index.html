<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techwave Enterprises – Tax Invoice Generator</title>
  <style>
    :root {
      --navy: #0b2a6b;
      --blue: #1e56d8;
      --orange: #f26a1b;
      --bg: #eef2f8;
      --card: #fff;
      --line: #d5dcea;
      --text: #17233f;
      --muted: #5b6785;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px
    }

    /* ---------- App shell ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--navy);
      color: #fff;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-wrap: wrap
    }

    .topbar h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: .3px
    }

    .topbar h1 span {
      color: #ffb27f
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    button,
    .btn {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600
    }

    .btn-primary {
      background: var(--orange);
      color: #fff
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .14);
      color: #fff
    }

    .btn-ghost.ok {
      background: #1a7f37
    }

    @media print {
      #toast {
        display: none !important
      }
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12.5px;
      background: #e8eefc;
      color: var(--navy)
    }

    .btn-danger {
      background: #fde8e6;
      color: #b42318
    }

    .tabs {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .tabs button {
      flex: 1;
      background: none;
      border-radius: 0;
      padding: 12px;
      color: var(--muted);
      border-bottom: 3px solid transparent
    }

    .tabs button.on {
      color: var(--navy);
      border-bottom-color: var(--orange)
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 440px) 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1500px;
      margin: 0 auto;
      align-items: start
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--navy)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text)
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #9db8f5;
      border-color: #6f93ee
    }

    textarea {
      resize: vertical;
      min-height: 58px
    }

    details.card summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--navy);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    details.card[open] summary {
      margin-bottom: 10px
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0
    }

    .check input {
      width: auto
    }

    .check label {
      margin: 0;
      font-size: 13px;
      color: var(--text)
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafcff
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--navy)
    }

    .item .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .preview-wrap {
      overflow: auto;
      padding-bottom: 30px
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px
    }

    @media (max-width:980px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 10px
      }

      .tabs {
        display: flex
      }

      body.tab-edit .preview-wrap {
        display: none
      }

      body.tab-preview .panel {
        display: none
      }
    }

    /* ---------- Invoice sheet ---------- */
    .sheet {
      background: #fff;
      width: 210mm;
      margin: 0 auto;
      padding: 8mm;
      box-shadow: 0 4px 24px rgba(15, 35, 80, .18);
      color: #111;
      font-size: 9pt;
      line-height: 1.35;
      transform-origin: top left
    }

    .sheet.landscape {
      width: 297mm
    }

    .inv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 2.5px solid var(--navy);
      position: relative
    }

    .inv-head::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 38%;
      height: 2px;
      background: var(--orange)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .brand svg {
      width: 82px;
      height: 48px;
      flex: none
    }

    .brand .name {
      font-weight: 900;
      font-size: 21pt;
      letter-spacing: .5px;
      line-height: 1;
      color: var(--navy)
    }

    .brand .name b {
      color: var(--blue)
    }

    .brand .sub {
      font-weight: 700;
      letter-spacing: 5px;
      font-size: 8.5pt;
      color: var(--navy);
      margin-top: 2px
    }

    .brand .tag {
      font-size: 6.5pt;
      letter-spacing: 2px;
      color: var(--orange);
      font-weight: 700;
      margin-top: 2px
    }

    .contact {
      text-align: right;
      font-size: 8.5pt;
      line-height: 1.45
    }

    .contact .addr {
      max-width: 95mm;
      margin-left: auto;
      white-space: pre-line
    }

    .contact b {
      color: var(--navy)
    }

    .inv-title {
      text-align: center;
      font-weight: 800;
      font-size: 12.5pt;
      letter-spacing: 1px;
      color: var(--navy);
      margin: 9px 0 5px;
      text-transform: uppercase
    }

    .inv-title .hl {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      padding: 2px 26px;
      border-radius: 3px;
      letter-spacing: 3px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .meta>div {
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .meta>div:nth-child(odd) {
      border-right: 1px solid #333
    }

    .meta b {
      font-weight: 700
    }

    .parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .parties>div {
      padding: 4px 6px;
      border-bottom: 1px solid #333;
      min-height: 30mm
    }

    .parties>div:first-child {
      border-right: 1px solid #333
    }

    .parties h4 {
      margin: 0 0 3px;
      font-size: 9pt;
      color: var(--navy)
    }

    .parties .line {
      white-space: pre-line
    }

    table.items {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      border: 1px solid #333;
      font-size: 11pt
    }

    .sheet.landscape table.items tr.fill {
      height: 12mm !important
    }

    .uv {
      font-size: 10.5pt;
      font-weight: 600
    }

    table.items th,
    table.items td {
      border: 1px solid #333;
      padding: 3px 2px;
      vertical-align: top;
      white-space: nowrap;
      font-size: 1em
    }

    table.items td.desc {
      white-space: pre-line;
      overflow-wrap: anywhere;
      min-width: 28mm;
      width: 100%
    }

    table.items thead th {
      white-space: nowrap;
      font-size: 8.5pt;
      padding: 3px 3px
    }

    table.items thead th.wrap {
      white-space: normal
    }



    table.items thead th {
      background: #eaf0fd;
      color: var(--navy);
      text-align: center;
      font-weight: 700;
      vertical-align: middle
    }

    table.items thead {
      display: table-header-group
    }

    table.items tbody tr {
      break-inside: avoid;
      page-break-inside: avoid
    }

    table.items td.n {
      text-align: right;
      white-space: nowrap
    }

    table.items td.c {
      text-align: center
    }

    table.items tr.fill td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:not(.fill) td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:last-child td {
      border-bottom: 0
    }

    .bottom {
      break-inside: avoid;
      page-break-inside: avoid;
      border: 1px solid #333;
      border-top: 0
    }

    .bottom .row {
      display: grid;
      grid-template-columns: 1.25fr 1fr
    }

    .bottom .left {
      padding: 5px 6px;
      border-right: 1px solid #333
    }

    .bottom .sum div {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .bottom .sum div:last-child {
      border-bottom: 0;
      font-weight: 800;
      background: #eaf0fd;
      color: var(--navy);
      font-size: 10pt
    }

    .words {
      font-weight: 700
    }

    .terms {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .bank {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .sign {
      border-top: 1px solid #333;
      display: grid;
      grid-template-columns: 1fr 1fr;
      break-inside: avoid
    }

    .sign>div {
      padding: 6px;
      min-height: 24mm
    }

    .sign .r {
      text-align: right;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .sign b {
      color: var(--navy)
    }

    .foot {
      margin-top: 6px;
      text-align: center;
      font-style: italic;
      font-size: 8pt;
      color: var(--navy);
      background: #eaf0fd;
      padding: 4px;
      border-radius: 2px
    }


    /* ---------- Quotation layout ---------- */
    .q-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 2.5px solid var(--navy);
      position: relative
    }

    .q-head::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 38%;
      height: 2px;
      background: var(--orange)
    }

    .q-brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .q-brand svg {
      width: 96px;
      height: 56px;
      flex: none
    }

    .q-name {
      font-weight: 900;
      font-size: 24pt;
      letter-spacing: .5px;
      line-height: 1;
      color: var(--navy)
    }

    .q-name b {
      color: var(--blue)
    }

    .q-sub {
      font-weight: 700;
      letter-spacing: 5px;
      font-size: 9.5pt;
      color: var(--navy);
      margin-top: 3px
    }

    .q-slogan {
      font-size: 7.5pt;
      letter-spacing: 2px;
      color: var(--orange);
      font-weight: 700;
      margin-top: 3px
    }

    .q-title span {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-size: 22pt;
      letter-spacing: 3px;
      padding: 2px 20px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase
    }

    .q-top {
      display: grid;
      grid-template-columns: 1fr 76mm;
      gap: 10mm;
      margin-top: 5mm;
      font-size: 9pt;
      line-height: 1.45
    }

    .q-lbl {
      font-weight: 800;
      color: var(--navy);
      text-transform: uppercase;
      margin-top: 2mm
    }

    .q-lbl:first-child {
      margin-top: 0
    }

    .q-pre {
      white-space: pre-line
    }

    table.q-meta {
      width: 100%;
      border-collapse: collapse;
      font-size: 9.5pt
    }

    table.q-meta td {
      border: 1px solid #333;
      padding: 3px 7px
    }

    table.q-meta td:first-child {
      text-align: right;
      font-weight: 800;
      color: var(--navy);
      width: 44%
    }

    table.q-meta td:last-child {
      text-align: center
    }

    .q-by {
      margin: 4mm 0 3mm;
      font-size: 9pt
    }

    .q-by span {
      display: inline-block;
      min-width: 100mm;
      border-bottom: 1px dotted #666;
      padding: 0 4px;
      font-weight: 700
    }

    table.qitems {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid #333;
      font-size: 11.5pt
    }

    table.qitems thead {
      display: table-header-group
    }

    table.qitems th {
      background: #eaf0fd;
      color: var(--navy);
      border: 1px solid #333;
      padding: 6px 6px;
      font-size: 10.5pt;
      letter-spacing: .4px;
      text-transform: uppercase
    }

    table.qitems td {
      border-left: 1px solid #333;
      border-right: 1px solid #333;
      padding: 6px 7px;
      vertical-align: top;
      overflow-wrap: anywhere
    }

    table.qitems td b {
      font-size: 12.5pt
    }

    table.qitems tbody tr {
      break-inside: avoid;
      page-break-inside: avoid
    }

    table.qitems td.n {
      text-align: right;
      white-space: nowrap
    }

    table.qitems td.c {
      text-align: center
    }

    table.qitems tr.last td {
      border-bottom: 1px solid #333
    }

    .q-hsn {
      font-size: 9pt;
      color: #555
    }

    .q-bottom {
      display: grid;
      grid-template-columns: 1fr 78mm;
      gap: 8mm;
      margin-top: 0;
      break-inside: avoid;
      page-break-inside: avoid
    }

    .q-left {
      padding-top: 3mm;
      font-size: 8pt;
      line-height: 1.35
    }

    .q-left .q-lbl {
      margin-top: 0
    }

    .q-words {
      font-weight: 700;
      margin-bottom: 3mm
    }

    .q-tot div {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      border: 1px solid #333;
      border-top: 0;
      padding: 4px 8px;
      font-size: 9.5pt
    }

    .q-tot div span:first-child {
      font-weight: 800;
      color: var(--navy);
      text-transform: uppercase
    }

    .q-tot div:last-child {
      background: #eaf0fd;
      font-size: 11pt
    }

    .q-foot {
      break-inside: avoid;
      page-break-inside: avoid;
      font-size: 9pt;
      margin-top: 4mm
    }

    .q-accept {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10mm
    }

    .q-accept .ln {
      flex: 1;
      border-bottom: 1px dashed #555;
      min-width: 50mm;
      margin: 0 3mm;
      height: 8mm
    }

    .q-acceptl {
      display: flex;
      align-items: flex-end;
      flex: 1;
      white-space: nowrap
    }

    .q-sig {
      text-align: right;
      min-width: 55mm
    }

    .q-sig div:first-child {
      margin-bottom: 7mm
    }

    .q-contact {
      text-align: center;
      margin-top: 4mm;
      color: #333
    }

    .q-thanks {
      text-align: center;
      margin-top: 3mm;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--navy)
    }

    /* ---------- Print ---------- */
    @media print {

      html,
      body {
        background: #fff
      }

      .topbar,
      .tabs,
      .panel {
        display: none !important
      }

      .layout {
        display: block;
        padding: 0;
        margin: 0;
        max-width: none
      }

      .preview-wrap {
        display: block !important;
        overflow: visible;
        padding: 0
      }

      .sheet {
        box-shadow: none;
        margin: 0;
        padding: 0;
        width: auto !important;
        zoom: 1 !important
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
    }
  </style>
  <style id="pageRule">
    @page {
      size: A4 portrait;
      margin: 8mm
    }
  </style>
</head>

<body class="tab-edit">
  <div id="toast" style="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17233f;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;max-width:90vw;z-index:50;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3)"></div>

  <div class="topbar">
    <h1>TECH<span>WAVE</span> · Invoice Generator</h1>
    <div class="actions">
      <button class="btn-ghost" id="xlChip" title="Connect your Excel file once; every bill is then saved to it">📊 Connect Excel</button>
      <button class="btn-ghost" id="btnReset">New invoice</button>
      <button class="btn-primary" id="btnPrint">🖨 Print / Save as PDF</button>
    </div>
  </div>
  <div class="tabs">
    <button id="tabEdit" class="on">Edit</button>
    <button id="tabPrev">Preview</button>
  </div>

  <div class="layout">
    <!-- ================= FORM ================= -->
    <div class="panel">

      <details class="card">
        <summary>Your company (saved on this device)</summary>
        <div class="grid2">
          <div class="full"><label>Address (appears on the invoice)</label><textarea data-k="coAddress"
              placeholder="Shop / Office address, City, PIN"></textarea></div>
          <div><label>Mobile no.</label><input data-k="coPhone"></div>
          <div><label>Email</label><input data-k="coEmail"></div>
          <div><label>Your GSTIN</label><input data-k="coGstin" placeholder="27XXXXXXXXXXXZX"></div>
          <div><label>State / Code</label>
            <div class="grid2"><input data-k="coState" placeholder="Maharashtra"><input data-k="coStateCode"
                placeholder="27"></div>
          </div>
          <div class="full"><label>Bank details (optional)</label><textarea data-k="bank"
              placeholder="Bank name, A/c no., IFSC"></textarea></div>
        </div>
      </details>

      <div class="card">
        <h2>Invoice details</h2>
        <div class="grid2">
          <div class="full"><label>Document type</label>
            <select data-k="docType" style="font-weight:700">
              <option value="invoice">Tax Invoice</option>
              <option value="quotation">Quotation</option>
            </select>
          </div>
          <div><label id="lblNo">Serial Number Invoice (auto)</label><input data-k="invNo" readonly tabindex="-1" title="Generated automatically" style="background:#f1f4fa;font-weight:700;color:#0b2a6b;cursor:not-allowed"></div>
          <div><label>Mode of Transport</label><input data-k="transport" placeholder="Courier / Road"></div>
          <div><label>P.O. No.</label><input data-k="poNo"></div>
          <div><label>P.O. Date</label><input type="date" data-k="poDate"></div>
          <div><label>Date of Supply</label><input type="date" data-k="supplyDate"></div>
          <div><label>Time of Supply</label><input type="time" data-k="supplyTime"></div>
          <div><label>Vehicle No.</label><input data-k="vehicle"></div>
          <div class="full" id="gstWrap" style="display:none"><label>GST on this quotation</label>
            <select data-k="gstOpt" style="font-weight:700"><option value="with">With GST</option><option value="without">Without GST</option></select>
          </div>
          <div class="full" id="prepWrap" style="display:none"><label>Quotation prepared by</label><input data-k="preparedBy" placeholder="Name of the person preparing this quotation"></div>
          <div><label id="lblDue">Due Date</label><input type="date" data-k="dueDate"></div>
          <div><label id="lblStatus">Payment Status</label>
            <select data-k="payStatus"><option value=""></option><option>Unpaid</option><option>Paid</option><option>Partially Paid</option><option>Overdue</option></select>
          </div>
          <div><label>Place of Supply</label><input data-k="placeOfSupply"></div>
        </div>
      </div>

      <div class="card">
        <h2>Receiver (Billed To)</h2>
        <div class="grid2">
          <div class="full"><label>Name</label><input data-k="bName"></div>
          <div class="full"><label>Address</label><textarea data-k="bAddress"></textarea></div>
          <div><label>State</label><input data-k="bState"></div>
          <div><label>State Code</label><input data-k="bStateCode" inputmode="numeric"></div>
          <div class="full"><label>GSTIN / Unique ID </label><input data-k="bGstin"
              style="background:#f1f4fa;font-weight:600"></div>
        </div>
      </div>

      <div class="card" id="consCard">
        <h2>Consignee (Shipped To)</h2>
        <div class="check"><input type="checkbox" id="same" data-k="same"><label for="same">Same as Receiver</label>
        </div>
        <div class="grid2" id="consigneeFields">

      var ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];

      function below1000(n) { var s = ""; if (n >= 100) { s = ONES[Math.floor(n / 100)] + " Hundred"; n %= 100; if (n) s += " " } return s + (n ? below100(n) : "") }

      function writeRec(ws, cfg, r, rec) {
        cellVals(cfg, rec).forEach(function (x, i) { ws.getCell(r, i + 1).value = x === undefined ? null : x });
        ws.getCell(r, cfg.srcCol).value = rec.src; ws.getCell(r, cfg.remCol).value = blank(rec.rem);
      }
      function scanSheet(ws) {
        var map = {}, last = FIRST - 1;
        for (var r = FIRST; r <= Math.max(ws.rowCount, LAST); r++) {
          var v = ws.getCell(r, 1).value;
          if (v !== null && v !== undefined && String(v).trim() !== "") { last = r; var k = String(v).trim().toUpperCase(); if (!map[k]) map[k] = r }
        }
        return { map: map, last: last };
      }
      async function writeToHandle(h, EJ, rec, cfg, isNew) {
        var file = await h.getFile(), wb;
        if (file.size > 0) {
          wb = new EJ.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
          if (!wb.getWorksheet(CFG.invoice.sheet) && !wb.getWorksheet(CFG.quotation.sheet)) throw new Error("This Excel file is not a Techwave register (no “" + CFG.invoice.sheet + "” sheet). Choose the register file or create a new one.");
        } else wb = buildFresh(EJ);
        var ws = wb.getWorksheet(cfg.sheet);
        if (!ws) { ws = addRegisterSheet(wb, cfg); if (cfg.type === "quotation") addQuoteSummary(wb) }
        var sc = scanSheet(ws), renum = false;
        /* a brand-new document whose number is already taken in the file (e.g. issued from another page): take the next free number */
        if (isNew && sc.map[rec.no.toUpperCase()]) {
          var fy = fyOf(), hi = highest(cfg, fy);
          Object.keys(sc.map).forEach(function (k) { hi = Math.max(hi, seqOf(cfg, k, fy)) });
          rec.no = makeNo(cfg, hi + 1, fy); renum = true; sc = scanSheet(ws);
        }
        var hit = sc.map[rec.no.toUpperCase()], result;
        if (hit) { writeRec(ws, cfg, hit, rec); result = "updated" }
        else { var row = sc.last + 1; if (row > LAST) styleRow(ws, cfg, row); writeRec(ws, cfg, row, rec); result = "added" }
        wb.calcProperties = { fullCalcOnLoad: true };
        var buf = await wb.xlsx.writeBuffer();
        var w = await h.createWritable(); await w.write(buf); await w.close();
        return { result: result, renumbered: renum };
      }

      /* save the current invoice / quotation. Resolves {ok, reason, text} */
      async function saveRecord() {
        var cfg = cfgNow(), word = cfg.type === "quotation" ? "Quotation" : "Invoice", rec = recordOf(cfg);
        if (!rec.no) return { ok: false, reason: "nonumber", text: "The " + word.toLowerCase() + " number is empty – it is the unique key of each Excel record." };
        if (!fileHandle) {
          var was = upsertLog(cfg, rec); bumpCounter(cfg, rec.no); S.recNo = rec.no; persist();
          return { ok: true, text: word + " " + (was ? "updated" : "saved") + " saved on this device. Tap “Connect Excel” (top) once to save it to your Excel file too." };
        }
        try {
          if (!(await ensurePerm(fileHandle))) return { ok: false, reason: "perm", text: "Permission to edit the Excel file was not given." };
          var EJ = await loadExcelJS(), res = await writeToHandle(fileHandle, EJ, rec, cfg, S.recNo !== rec.no);
          if (res.renumbered) { S.invNo = rec.no }
          S.recNo = rec.no; upsertLog(cfg, rec); bumpCounter(cfg, rec.no); persist();
          if (res.renumbered) { syncForm(); render() }
          return { ok: true, text: word + " " + rec.no + (res.renumbered ? " was already taken in the file, so the next free number was used and " : " ") + (res.result === "updated" ? "already existed – its row was updated (no duplicate)." : "added to the " + cfg.sheet + " sheet of " + fileHandle.name + ".") };
        } catch (e) {
          var m = String(e && e.message || e);
          if (/NotAllowed|Permission/i.test(m)) m = "The Excel file could not be written. Close it in Excel (a file open in Excel is locked) and try again.";
          return { ok: false, reason: "error", text: m };
        }
      }

      async function recordAndPrint() {
        /* first time only: ask for the Excel file (needs this click, so it is done before anything else) */
        var skip = false; try { skip = sessionStorage.getItem("xlSkip") === "1" } catch (e) { }
        if (!fileHandle && hasFS && !skip) { await pick(); if (!fileHandle) { try { sessionStorage.setItem("xlSkip", "1") } catch (e) { } } }
        var r = await saveRecord();
        setMsg(r.text, !r.ok);
        if (!r.ok) {
          if (!confirm(r.text + "\n\nThis document will NOT be recorded in Excel. Print anyway?")) return;
        }
        window.print();
      }

      /* when a register file is linked, learn the numbers already in it */
      async function syncCounterFromFile(h, EJ) {
        var f = await h.getFile(); if (!f.size) return;
        var wb = new EJ.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
        [CFG.invoice, CFG.quotation].forEach(function (cfg) {
          var ws = wb.getWorksheet(cfg.sheet); if (!ws) return;
          for (var r = FIRST; r <= Math.max(ws.rowCount, LAST); r++) { var v = ws.getCell(r, 1).value; if (v) bumpCounter(cfg, v) }
        });
      }

      async function pick() {
          var create = true;
        try {
          var opts = { startIn: "desktop", types: [{ description: "Excel workbook", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }] };
          var h;
          if (create) { opts.suggestedName = "Invoice_Register.xlsx"; h = await window.showSaveFilePicker(opts) }
          else { h = (await window.showOpenFilePicker(opts))[0] }
          fileHandle = h; await storeHandle(h); setStatus();
          var EJ = await loadExcelJS();
          if (create) {
            var f = await h.getFile();
            if (f.size === 0) { var wb = buildFresh(EJ); var w = await h.createWritable(); await w.write(await wb.xlsx.writeBuffer()); await w.close() }
          }
          /* put every record already logged in this browser into the file */
          var n = 0;
          for (var cfg of [CFG.invoice, CFG.quotation]) { var log = readLog(cfg); for (var i = 0; i < log.length; i++) { await writeToHandle(h, EJ, log[i], cfg, false); n++ } }
          await syncCounterFromFile(h, EJ);
          var cfgN = cfgNow(), cur = String(S.invNo || "").trim(), fy = fyOf();
          if (seqOf(cfgN, cur, fy) && !readLog(cfgN).some(function (r) { return String(r.no).toUpperCase() === cur.toUpperCase() })) {
            var nx = nextNo(cfgN); if (seqOf(cfgN, nx, fy) > seqOf(cfgN, cur, fy)) { S.invNo = nx; persist(); syncForm(); render() }
          }
          setMsg("Linked to " + h.name + (n ? " – " + n + " earlier record(s) synced." : "."), false);
        } catch (e) { if (e && e.name !== "AbortError") setMsg(String(e.message || e), true) }
      }
      async function downloadRegister() {
        try {
          var EJ = await loadExcelJS(), wb = buildFresh(EJ), cnt = 0;
          [CFG.invoice, CFG.quotation].forEach(function (cfg) {
            var ws = wb.getWorksheet(cfg.sheet);
            readLog(cfg).forEach(function (rec) { var sc = scanSheet(ws), hit = sc.map[rec.no.toUpperCase()]; if (hit) writeRec(ws, cfg, hit, rec); else writeRec(ws, cfg, sc.last + 1, rec); cnt++ });
          });
          wb.calcProperties = { fullCalcOnLoad: true };
          var blob = new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Invoice_Register.xlsx"; document.body.appendChild(a); a.click(); a.remove();
          setMsg("Downloaded Invoice_Register.xlsx with all " + cnt + " record(s) saved on this device.", false);
        } catch (e) { setMsg(String(e.message || e), true) }
      }
      $("#xlChip").addEventListener("click", function () {
        if (!hasFS) { downloadRegister(); return }
        if (fileHandle && !confirm("Connected to " + fileHandle.name + ".\nChoose a different Excel file?")) return;
        pick();
      });
      loadHandle();

      /* numbers are system-generated only: replace blanks and any hand-typed value */
      if (!isValidNo(cfgNow(), S.invNo)) { S.invNo = nextInvNo(); persist() }
      applyDocType();

      syncForm(); renderItems(); render();
      window.__invoice = { applyDocType: applyDocType, nextInvNo: nextInvNo, saveRecord: saveRecord, setHandle: function (h) { fileHandle = h }, buildFresh: buildFresh, compute: compute, amountWords: amountWords, state: function () { return S } };
    })();
  </script>
</body>

</html>
