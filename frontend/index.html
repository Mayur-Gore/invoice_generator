<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Techwave Enterprises Invoice Generator</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand & Logo -->
      <div class="login-header">
        <div class="brand-logo">
          <svg viewBox="0 0 170 100" aria-hidden="true">
            <defs>
              <clipPath id="twc"><rect x="0" y="10" width="200" height="80"/></clipPath>
            </defs>
            <g transform="translate(24,0) skewX(-14)">
              <rect x="0" y="10" width="62" height="15" fill="#0b2a6b"/>
              <rect x="22" y="25" width="17" height="65" fill="#0b2a6b"/>
              <g clip-path="url(#twc)">
                <polyline points="58,0 75,92 96,40 117,92 134,0" fill="none" stroke="#1e56d8" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="10"/>
              </g>
            </g>
            <polygon points="72,0 50,48 62,48 42,100 80,40 66,40 82,0" fill="#f26a1b" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-name">TECH<span>WAVE</span></div>
        <div class="brand-sub">ENTERPRISES</div>
        <div class="brand-tag">POWERING YOUR INDUSTRY</div>
      </div>

      <div class="login-title-box">
        <h2>Sign In</h2>
        <p>Enter your ID and Password to generate invoices & quotations</p>
      </div>

      <!-- Alert / Notice Box -->
      <div id="alertBox" class="alert hidden" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginId">User ID / Username</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="loginId" name="loginId" placeholder="Enter your ID or username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter password" required>
            <button type="button" id="togglePassword" class="toggle-pass-btn" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="btn-text">Sign In &amp; Open Generator &rarr;</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <!-- System Status / Footer -->
      <div class="login-footer">
        <div id="dbStatusBadge" class="status-badge checking">
          <span class="status-dot"></span>
          <span id="dbStatusText">Checking MongoDB...</span>
        </div>
        <p class="admin-hint">Credentials can be inserted directly into MongoDB (no encryption required).</p>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
